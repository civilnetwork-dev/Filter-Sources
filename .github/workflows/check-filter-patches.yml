# Checks every tracked filter extension's update server twice a week (Monday
# and Thursday, ~3.5 days apart — "every half week") for a new version. On a
# change, downloads it, deobfuscates the changed files, diffs them against
# the last snapshot, and scans the diff for signatures pulled from Civil
# Proxy's own filterBlockerMiddleware.ts. Commits extensions.json (new
# versions) and CHANGES_NEEDED.md if anything moved.
#
# The deobfuscated snapshots themselves are NOT committed — see .gitignore.
# They still have to survive between runs, since a diff needs something to
# diff against; they ride the Actions cache instead of git.
#
# Budget: blacksmith-2vcpu-ubuntu-2404 is deliberately small — this job is
# network-bound (Omaha queries, CRX downloads), not compute-bound, so a
# bigger runner buys nothing. At 2x/week that's ~104 runs/year; even a
# generous 5 minutes/run is ~43 minutes/month against the 3,000 free
# minutes/month this org has — see mcp__blacksmith-usage__blacksmith_monthly_usage,
# confirmed at 0/3000 used before this workflow's first run. Runner label
# taken from Blacksmith's standard convention; if this org's available
# runner types differ, adjust `runs-on` to match what's shown in the
# Blacksmith dashboard.
#
# Speed vs. GitHub Actions: setup-zig caches both the toolchain and the
# global Zig cache (keyed on tools/build.zig.zon, so the ~15MB yuku
# dependency is covered too), which means only the first run pays to fetch
# and build them. Every run after that starts warm — on top of Blacksmith's
# faster disk and network, which a same-shaped plain GitHub Actions workflow
# would not have.
name: Check filter patches

on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-filter-patches
  cancel-in-progress: false

jobs:
  check:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout Filter-Sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Only misc/filters is needed (for filterBlockerMiddleware.ts, the
      # signature source — see tools/src/signatures.zig), not the whole
      # Civil Proxy tree. A sparse, shallow checkout keeps this fast and
      # keeps a private repo's checkout token scoped to the one directory
      # this workflow actually reads.
      - name: Checkout Civil Proxy (misc/filters only)
        uses: actions/checkout@v4
        with:
          repository: civilnetwork-dev/Civil
          ref: master
          path: civil-checkout
          fetch-depth: 1
          sparse-checkout: |
            misc/filters
          sparse-checkout-cone-mode: false

      # Must match `minimum_zig_version` in tools/build.zig.zon. This is the
      # step whose absence made the first run fail with
      # `zig: command not found` — nothing else here installs a toolchain.
      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The deobfuscated snapshots from the previous run — the baseline the
      # checker diffs this run's downloads against. `key` is unique per run
      # so every run writes a fresh entry; `restore-keys` matches the newest
      # earlier one, which is the chain that carries the baseline forward.
      #
      # If the entry is ever evicted (GitHub drops caches untouched for 7
      # days; this one is rewritten twice a week, so that needs the workflow
      # to stop running first), the checker finds no baseline, records one,
      # and flags nothing that run — the same correct first-run behavior
      # described in the README. One cycle of detection is lost, not
      # correctness.
      - name: Restore extension snapshots
        uses: useblacksmith/cache@v5
        with:
          path: extensions
          key: filter-snapshots-${{ github.run_id }}
          restore-keys: |
            filter-snapshots-

      # Cheap, and it makes a broken toolchain say so here rather than as a
      # confusing failure inside a later build step.
      - name: Verify toolchain
        run: zig version

      - name: Fetch Zig dependencies
        working-directory: tools
        run: zig build --fetch

      - name: Run test suite
        working-directory: tools
        run: zig build test

      - name: Build checker
        working-directory: tools
        run: zig build -Doptimize=ReleaseSafe

      - name: Run check
        run: ./tools/zig-out/bin/check check --civil-dir "$GITHUB_WORKSPACE/civil-checkout"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add extensions.json
          # Tolerated failure, not sloppiness: CHANGES_NEEDED.md only exists
          # once something has actually been flagged, and `git add` errors on
          # a pathspec matching nothing — which under `bash -e` would fail
          # every run where no vendor has patched anything, i.e. the normal
          # case.
          git add CHANGES_NEEDED.md 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "chore: filter check $(date -u +%Y-%m-%d)"
          git push
